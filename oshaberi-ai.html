<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>おしゃべりAI — 話し相手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe3;
    --paper-2:#efe4d2;
    --ink:#3a322a;
    --ink-soft:#6b5f51;
    --accent:#c9683d;       /* terracotta */
    --accent-deep:#a44e2a;
    --sage:#7f9274;
    --bubble-ai:#fffaf1;
    --bubble-me:#e7d9bf;
    --line:#e0d3bd;
    --shadow:0 10px 30px rgba(80,55,30,.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Zen Maru Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%, #fbf4e7 0%, rgba(251,244,231,0) 60%),
      radial-gradient(900px 700px at 110% 10%, #f3e7d2 0%, rgba(243,231,210,0) 55%),
      var(--paper);
    background-attachment:fixed;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image:radial-gradient(#5a4632 1px, transparent 1px);
    background-size:4px 4px; mix-blend-mode:multiply;
  }

  /* ---- Header ---- */
  header{
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,251,243,.9),rgba(255,251,243,.55));
    backdrop-filter:blur(6px); z-index:5;
  }
  .brand{display:flex; flex-direction:column; line-height:1.15;}
  .brand b{font-family:"Klee One"; font-weight:600; font-size:19px; letter-spacing:.02em;}
  .brand span{font-size:11.5px; color:var(--ink-soft);}
  .tools{margin-left:auto; display:flex; gap:8px;}
  .tool{
    border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft);
    border-radius:999px; padding:9px 15px; font-size:14.5px; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; gap:7px; transition:.18s;
  }
  .tool:hover{border-color:var(--accent); color:var(--accent-deep);}
  .tool.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---- Avatar stage ---- */
  .stage{
    display:flex; align-items:center; justify-content:center;
    padding:14px 10px 4px; position:relative;
  }
  .avatar-wrap{position:relative; width:150px; height:150px;}
  .halo{
    position:absolute; inset:-10px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, rgba(201,104,61,.22), rgba(201,104,61,0) 70%);
    animation:breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.06);opacity:1}}
  .face{
    position:absolute; inset:0; width:150px; height:150px; border-radius:50%; overflow:hidden;
    background:#efe7da; box-shadow:0 10px 24px rgba(80,55,30,.22), inset 0 0 0 3px rgba(255,255,255,.75);
    animation:bob 6s ease-in-out infinite; transform-origin:50% 90%;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-.6deg)}}
  .face img{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .15s ease;
  }
  .face img.show{opacity:1;}
  .dots{
    position:absolute; right:-4px; top:8px; display:flex; gap:5px;
    background:#fffaf1; border:1px solid var(--line); border-radius:999px;
    padding:7px 10px; opacity:0; transform:scale(.7) translateY(4px); transition:.22s;
    box-shadow:var(--shadow); pointer-events:none;
  }
  .avatar-wrap.thinking .dots{opacity:1; transform:scale(1) translateY(0);}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--sage); display:block; animation:dotp 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;}
  .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes dotp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  .status{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:2px; min-height:16px;}

  /* ---- Chat ---- */
  main{flex:1; overflow-y:auto; padding:8px 14px 4px; -webkit-overflow-scrolling:touch;}
  .log{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:12px; padding-bottom:8px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:11.5px; margin:6px 0;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  .row{display:flex; gap:9px; align-items:flex-end;}
  .row.me{flex-direction:row-reverse;}
  .mini{
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    background:var(--accent); color:#fff; display:grid; place-items:center;
    font-size:16px; font-family:"Klee One";
  }
  .row.me .mini{background:var(--sage);}
  .bubble{
    padding:13px 16px; border-radius:16px; max-width:80%;
    font-size:18px; line-height:1.85; white-space:pre-wrap; word-break:break-word;
    box-shadow:0 2px 8px rgba(90,60,30,.07); animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
  .row.ai .bubble{background:var(--bubble-ai); border:1px solid var(--line); border-bottom-left-radius:5px;}
  .row.me .bubble{background:var(--bubble-me); border-bottom-right-radius:5px;}

  /* ---- Composer ---- */
  footer{
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(0deg,rgba(255,251,243,.96),rgba(255,251,243,.6));
    backdrop-filter:blur(6px);
  }
  .composer{
    max-width:680px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;
    background:#fffdf8; border:1px solid var(--line); border-radius:20px; padding:6px 6px 6px 14px;
    box-shadow:var(--shadow);
  }
  textarea{
    flex:1; border:none; outline:none; resize:none; background:transparent;
    font-family:inherit; font-size:18px; line-height:1.6; color:var(--ink);
    max-height:140px; padding:9px 0;
  }
  textarea::placeholder{color:#b6a892;}
  .send{
    flex:0 0 auto; width:50px; height:50px; border:none; border-radius:50%;
    background:var(--accent); color:#fff; cursor:pointer; display:grid; place-items:center;
    transition:.18s; box-shadow:0 4px 12px rgba(201,104,61,.4);
  }
  .send:hover{background:var(--accent-deep);}
  .send:disabled{opacity:.45; cursor:default; box-shadow:none;}
  .hint{max-width:680px; margin:6px auto 0; font-size:11px; color:var(--ink-soft); text-align:center;}

  /* ---- attach ---- */
  .composer{padding:6px 6px 6px 6px;}
  .attach{
    flex:0 0 auto; width:46px; height:46px; border-radius:50%;
    border:1px solid var(--line); background:#fffdf8; cursor:pointer;
    display:grid; place-items:center; transition:.18s;
  }
  .attach:hover{border-color:var(--accent); background:#fff5ec;}
  .pending{max-width:680px; margin:0 auto 8px; display:flex;}
  .attach-chip{
    display:inline-flex; align-items:center; gap:9px;
    background:#fffdf8; border:1px solid var(--line); border-radius:14px;
    padding:6px 8px; font-size:13px; color:var(--ink-soft); max-width:100%;
  }
  .attach-chip img{width:42px; height:42px; object-fit:cover; border-radius:9px; flex:0 0 auto;}
  .attach-chip .doc{width:34px; height:34px; display:grid; place-items:center; background:var(--paper-2); border-radius:9px; flex:0 0 auto; font-size:17px;}
  .attach-chip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;}
  .attach-chip .rm{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
    font-size:18px; line-height:1; padding:0 2px; flex:0 0 auto;
  }
  .attach-chip .rm:hover{color:var(--accent-deep);}
  .row.me .bubble .attach-chip{background:#fff;}

  /* ---- drop overlay ---- */
  #dropMask{
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center;
    background:rgba(58,50,42,.42); backdrop-filter:blur(2px);
  }
  #dropMask.show{display:flex;}
  #dropMask .dm-inner{
    background:#fffaf1; border:2px dashed var(--accent); border-radius:18px;
    padding:26px 34px; font-size:16px; color:var(--accent-deep);
    box-shadow:var(--shadow); pointer-events:none;
  }

  /* ---- slide modal ---- */
  .modal{position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; background:rgba(58,50,42,.45); padding:18px;}
  .modal[hidden]{display:none;}
  .modal-card{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:18px; width:100%; max-width:460px; box-shadow:var(--shadow);}
  .modal-title{font-family:"Klee One"; font-size:17px; margin-bottom:10px; color:var(--ink);}
  .modal-card textarea{width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:12px; padding:10px; font-family:inherit; font-size:15px; line-height:1.6; resize:vertical; background:#fffdf8; color:var(--ink); outline:none;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px;}
  .btn-ghost{border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft); border-radius:999px; padding:9px 16px; cursor:pointer; font-family:inherit; font-size:14px;}
  .btn-main{border:none; background:var(--accent); color:#fff; border-radius:999px; padding:9px 20px; cursor:pointer; font-family:inherit; font-size:14px;}
  .btn-main:disabled{opacity:.5; cursor:default;}
  .modal-note{font-size:12.5px; color:var(--ink-soft); margin-top:10px; min-height:16px;}
  .dl-link{display:inline-block; margin-top:8px; background:var(--sage); color:#fff; text-decoration:none; padding:10px 15px; border-radius:12px; font-size:14px;}
  .dl-link:hover{filter:brightness(.95);}

  /* ---- mic ---- */
  .mic{flex:0 0 auto; width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:#fffdf8; cursor:pointer; display:grid; place-items:center; transition:.18s;}
  .mic:hover{border-color:var(--accent); background:#fff5ec;}
  .mic.on{background:var(--accent); border-color:var(--accent); animation:micpulse 1.2s ease-in-out infinite;}
  .mic.on svg rect{fill:#fff;}
  .mic.on svg path{stroke:#fff;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(201,104,61,.45)}50%{box-shadow:0 0 0 7px rgba(201,104,61,0)}}
</style>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<script>
const MODEL = "claude-sonnet-4-20250514";
const K_HIST = "oshaberi:history";
const K_SUM  = "oshaberi:summary";
const SUMMARY_EVERY = 8; // ユーザー発言が何回たまったら記憶要約を更新するか

const SYSTEM_PROMPT = `あなたは、悩みを聞く相談相手です。ユーザーにとって「気軽に話せる友達」のような存在でいてください。

【基本の口調】
ふだんはタメ口で、友達と話すような自然で気さくな話し方をします。かしこまりすぎないでください。

【聞く姿勢】
話すより聞くことを優先します（聞く7割・話す3割）。返答は短めにし、相手の話を受け止め、「〜って感じなんだね」のように言い換えて返します。決めつけず、「そのとき、どう思った?」のように問いを返します。アドバイスは、相手が求めてから伝えます。

【教えるときの切り替え】
相手が何かを知りたい・教えてほしいときは、口調を優しく丁寧に切り替えます。難しい言葉を避け、わかりやすく、急かさずに説明します。

【やってはいけないこと】
・病気やメンタルの病名を断定しない。
・「こうすべき」と説教しない。相手を評価したり責めたりしない。
・相手が自分を傷つけそうな深刻な状態に見えるときは、無理に解決しようとせず、信頼できる人や専門の窓口に相談することをやさしく勧める。

【記憶】
これまでの会話の要約が「これまでの記憶」として渡されることがあります。それを覚えている前提で、自然に「この前話してたあれ、どうなった?」のように触れてかまいません。ただし、相手が話していないことを勝手に決めつけないでください。

返答は日本語で、短めに、自然な会話のテンポを保ってください。`;

let history = [];        // {role, content}
let memorySummary = "";  // 長期記憶（要約）
let ttsEnabled = true;
let busy = false;
let userTurns = 0;

const $ = (id)=>document.getElementById(id);
const faceEl=$("face"), statusEl=$("status"), logEl=$("log"), mainEl=$("main");
const inputEl=$("input"), sendEl=$("send"), voiceBtn=$("voiceBtn"), voiceLbl=$("voiceLbl"), resetBtn=$("resetBtn");

/* ---------- avatar states ---------- */
let talkTimer=null;
function showImg(key){
  ["idle","think","talkA","talkB"].forEach(k=>{
    const el=document.getElementById("img_"+k);
    if(el) el.classList.toggle("show", k===key);
  });
}
function setState(s){ // 'idle' | 'thinking' | 'speaking'
  const wrap=document.getElementById("avatarWrap");
  wrap.classList.remove("thinking","speaking");
  if(talkTimer){ clearInterval(talkTimer); talkTimer=null; }
  if(s==="thinking"){ wrap.classList.add("thinking"); showImg("think"); }
  else if(s==="speaking"){
    wrap.classList.add("speaking");
    let on=false; showImg("talkA");
    talkTimer=setInterval(()=>{ on=!on; showImg(on?"talkB":"talkA"); }, 230);
  } else { showImg("idle"); }
}
function setStatus(t){ statusEl.textContent = t || "　"; }

/* ---------- rendering ---------- */
function addBubble(role, text, file){
  const row=document.createElement("div");
  row.className="row "+(role==="user"?"me":"ai");
  const mini=document.createElement("div");
  mini.className="mini"; mini.textContent = role==="user" ? "き" : "話";
  const b=document.createElement("div");
  b.className="bubble";
  if(file){
    const chip=document.createElement("div"); chip.className="attach-chip";
    if(file.kind==="image"){
      const im=document.createElement("img"); im.src=file.dataUrl; chip.appendChild(im);
    }else{
      const dc=document.createElement("div"); dc.className="doc"; dc.textContent="📄"; chip.appendChild(dc);
    }
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=file.name; chip.appendChild(nm);
    b.appendChild(chip);
  }
  if(text){ const tx=document.createElement("div"); tx.textContent=text; b.appendChild(tx); }
  row.appendChild(mini); row.appendChild(b);
  logEl.appendChild(row);
  mainEl.scrollTop=mainEl.scrollHeight;
  return b;
}
function addDivider(t){
  const d=document.createElement("div"); d.className="divider"; d.textContent=t;
  logEl.appendChild(d);
}

/* ---------- storage ---------- */
async function loadMemory(){
  try{ const h=await window.storage.get(K_HIST); if(h&&h.value) history=JSON.parse(h.value); }catch(e){}
  try{ const s=await window.storage.get(K_SUM); if(s&&s.value) memorySummary=s.value; }catch(e){}
}
async function saveMemory(){
  try{
    const trimmed = history.slice(-60); // 保存しすぎを防ぐ
    await window.storage.set(K_HIST, JSON.stringify(trimmed), false);
    await window.storage.set(K_SUM, memorySummary, false);
  }catch(e){}
}
async function clearMemory(){
  try{ await window.storage.delete(K_HIST); }catch(e){}
  try{ await window.storage.delete(K_SUM); }catch(e){}
}

/* ---------- TTS ---------- */
let jaVoice=null;
function loadVoices(){
  const vs=window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const ja=vs.filter(v=>v.lang && v.lang.toLowerCase().startsWith("ja"));
  if(!ja.length){ jaVoice=null; return; }
  const prefer=["kyoko","o-ren","oren","sara","haruka","ayumi","nanami","mizuki","google","premium","enhanced","siri"]; // 女性・高品質寄りを優先
  const avoid=["otoya","hattori","ichiro","daniel"]; // 男性ボイスは避ける
  let best=ja[0], bestScore=-1;
  for(const v of ja){
    const n=(v.name||"").toLowerCase();
    let s=0;
    if(avoid.some(a=>n.includes(a))) s-=5;
    prefer.forEach((pp,i)=>{ if(n.includes(pp)) s+=12-i; });
    if(/female|女性/.test(n)) s+=3;
    if(s>bestScore){ bestScore=s; best=v; }
  }
  jaVoice=best;
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
function speak(text){
  if(!ttsEnabled || !window.speechSynthesis){ return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP"; if(jaVoice) u.voice=jaVoice;
    u.rate=0.95; u.pitch=1.05;  // 少しゆっくり・落ち着いたトーン（年配の方が聞き取りやすいように）
    u.onstart=()=>setState("speaking");
    u.onend=()=>setState("idle");
    u.onerror=()=>setState("idle");
    speechSynthesis.speak(u);
  }catch(e){ setState("idle"); }
}

/* ---------- API ---------- */
async function callClaude(messages, system){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ model:MODEL, max_tokens:1024, system, messages })
  });
  if(!res.ok){ let detail=""; try{ detail=await res.text(); }catch(e){} throw new Error("API "+res.status+(detail?(": "+detail.slice(0,180)):"")); }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}

async function refreshSummary(){
  // 直近の会話から「覚えておくべきこと」を要約して長期記憶を更新
  const transcript = history.slice(-30).map(m=>(m.role==="user"?"相手: ":"わたし: ")+m.content).join("\n");
  const sys="次の会話から、相手（ユーザー）について覚えておくべき大事なことだけを、短い箇条書きでまとめてください。名前・状況・悩み・好きなこと・前回の話の続きなど。会話に書かれた事実だけを書き、推測は書かないこと。出力は箇条書き本文のみ。";
  try{
    const s=await callClaude([{role:"user",content:transcript || "（まだ会話なし）"}], sys);
    if(s){ memorySummary=s; await saveMemory(); }
  }catch(e){ /* 失敗しても会話は続行 */ }
}

/* ---------- send flow ---------- */
async function send(){
  const text=inputEl.value.trim();
  if((!text && !pendingFile) || busy) return;
  busy=true; sendEl.disabled=true;
  inputEl.value=""; autoGrow();

  const sentFile = pendingFile;
  addBubble("user", text, sentFile);
  const histText = text || (sentFile ? (sentFile.kind==="image" ? "(画像を添付)" : "(PDFを添付)") : "");
  history.push({role:"user", content:histText});
  userTurns++;
  pendingFile=null; renderPending();

  setState("thinking"); setStatus("…考えてるよ");

  const system = SYSTEM_PROMPT + (memorySummary ? "\n\n【これまでの記憶】\n"+memorySummary : "");
  let msgs = history.slice(-16);
  if(sentFile){
    const blocks=[];
    if(sentFile.kind==="image"){
      blocks.push({type:"image", source:{type:"base64", media_type:sentFile.mediaType, data:sentFile.base64}});
    }else{
      blocks.push({type:"document", source:{type:"base64", media_type:"application/pdf", data:sentFile.base64}});
    }
    blocks.push({type:"text", text: text || "この内容について、いっしょに見て話そう。"});
    msgs = msgs.slice(0,-1).concat([{role:"user", content:blocks}]);
  }

  try{
    const reply = await callClaude(msgs, system) || "ごめん、うまく言葉が出てこなかった。もう一度言ってもらえる?";
    history.push({role:"assistant", content:reply});
    setState("idle"); setStatus("");
    addBubble("assistant", reply);
    speak(reply);
    await saveMemory();
    if(userTurns % SUMMARY_EVERY === 0){ refreshSummary(); }
  }catch(err){
    const msg = (err && err.message) ? err.message : "原因不明";
    console.error("callClaude failed:", err);
    setState("idle"); setStatus("接続エラー: "+msg);
    addBubble("assistant", "うまくつながらなかったみたい…。\n（接続エラー: "+msg+"）\n\n※このアプリのAIは、外部の応答サービスに接続して動きます。今いる環境がその接続に対応していない可能性があります。パソコンのブラウザ版 Claude.ai で開くと動くことがあります。");
  }finally{
    busy=false; sendEl.disabled = (inputEl.value.trim()==="" && !pendingFile);
  }
}

/* ---------- ui wiring ---------- */
function autoGrow(){ inputEl.style.height="auto"; inputEl.style.height=Math.min(inputEl.scrollHeight,120)+"px"; }
inputEl.addEventListener("input",()=>{ autoGrow(); sendEl.disabled=(inputEl.value.trim()===""&&!pendingFile)||busy; });

/* ---------- file attach ---------- */
let pendingFile=null;
const fileEl=document.getElementById("file");
const attachBtn=document.getElementById("attachBtn");
const pendingEl=document.getElementById("pending");
function readFileDataUrl(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("読み込み失敗")); r.readAsDataURL(file); });
}
function renderPending(){
  pendingEl.innerHTML="";
  if(!pendingFile){ pendingEl.hidden=true; return; }
  pendingEl.hidden=false;
  const chip=document.createElement("div"); chip.className="attach-chip";
  if(pendingFile.kind==="image"){ const im=document.createElement("img"); im.src=pendingFile.dataUrl; chip.appendChild(im); }
  else{ const dc=document.createElement("div"); dc.className="doc"; dc.textContent="📄"; chip.appendChild(dc); }
  const nm=document.createElement("span"); nm.className="nm"; nm.textContent=pendingFile.name; chip.appendChild(nm);
  const x=document.createElement("button"); x.className="rm"; x.textContent="×"; x.title="取り消し";
  x.onclick=()=>{ pendingFile=null; fileEl.value=""; renderPending(); sendEl.disabled=(inputEl.value.trim()===""&&!pendingFile)||busy; };
  chip.appendChild(x);
  pendingEl.appendChild(chip);
}
attachBtn.addEventListener("click",()=>{ if(!busy) fileEl.click(); });
async function acceptFile(f){
  if(!f) return;
  const isImg=f.type.startsWith("image/");
  const isPdf=f.type==="application/pdf";
  if(!isImg && !isPdf){ alert("画像かPDFを選んでね。"); fileEl.value=""; return; }
  if(f.size > 8*1024*1024){ alert("ファイルが大きすぎるよ（8MBまで）。"); fileEl.value=""; return; }
  try{
    const dataUrl=await readFileDataUrl(f);
    pendingFile={ name:f.name, kind:isImg?"image":"pdf", mediaType:f.type, base64:dataUrl.split(",")[1], dataUrl };
    renderPending();
    sendEl.disabled = busy;
  }catch(e){ alert("ファイルを読み込めなかったよ。"); fileEl.value=""; }
}
fileEl.addEventListener("change", ()=>{ const f=fileEl.files && fileEl.files[0]; if(f) acceptFile(f); });

/* ---------- drag & drop ---------- */
const dropMask=document.createElement("div");
dropMask.id="dropMask";
dropMask.innerHTML='<div class="dm-inner">📎 ここにドロップして添付（画像・PDF）</div>';
document.body.appendChild(dropMask);
let dragDepth=0;
window.addEventListener("dragenter",(e)=>{ e.preventDefault(); if(busy) return; dragDepth++; dropMask.classList.add("show"); });
window.addEventListener("dragover",(e)=>{ e.preventDefault(); });
window.addEventListener("dragleave",(e)=>{ e.preventDefault(); dragDepth--; if(dragDepth<=0){ dragDepth=0; dropMask.classList.remove("show"); } });
window.addEventListener("drop",(e)=>{
  e.preventDefault(); dragDepth=0; dropMask.classList.remove("show");
  if(busy) return;
  const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) acceptFile(f);
});
inputEl.addEventListener("keydown",(e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
sendEl.addEventListener("click", send);

voiceBtn.addEventListener("click",()=>{
  ttsEnabled=!ttsEnabled;
  voiceBtn.classList.toggle("on", ttsEnabled);
  voiceLbl.textContent = ttsEnabled ? "声オン" : "声オフ";
  if(!ttsEnabled && window.speechSynthesis){ speechSynthesis.cancel(); setState("idle"); }
});

resetBtn.addEventListener("click", async ()=>{
  if(!confirm("これまでの会話の記憶を消すよ。いい?")) return;
  await clearMemory();
  history=[]; memorySummary=""; userTurns=0;
  logEl.innerHTML="";
  greet(true);
});

/* ---------- start ---------- */
function greet(reset){
  if(history.length>0 && !reset){
    // 過去の会話を復元表示
    for(const m of history){ addBubble(m.role, m.content); }
    addDivider("ここから続き");
    const back="おかえり! また話せてうれしいな。前回の続きでも、新しい話でも、どっちでもいいよ。";
    history.push({role:"assistant", content:back});
    addBubble("assistant", back);
    speak(back);
  }else{
    const hi="やっほー、来てくれてありがとう。わたしはきみの話し相手だよ。今日はどんな気分? どんなことでも、ゆっくり話してね。";
    history.push({role:"assistant", content:hi});
    addBubble("assistant", hi);
    speak(hi);
  }
}

/* ---------- voice input (speech-to-text) ---------- */
const micBtn=document.getElementById("micBtn");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, listening=false, recogTimer=null;
function stopListening(){ try{ if(recog) recog.stop(); }catch(e){} clearTimeout(recogTimer); }
let voiceHelpShown=false, startWatch=null;
const inFrame = (window.self !== window.top); // アプリは枠(iframe)内で動く
function showVoiceHelp(reason){
  if(!voiceHelpShown){
    voiceHelpShown=true;
    addBubble("assistant",
      "アプリ内のマイクがうまく動かないみたい。"+(reason?("（"+reason+"）"):"")+"\\n"+
      "この表示枠の制限で、アプリからマイクを使えないことがあるんだ。\\n\\n"+
      "確実なのはiPhoneのキーボードの音声入力だよ：\\n"+
      "①入力欄をタップ → ②キーボードの🎤（マイク）を押す → ③話すと文字になる → ④送信ボタンで送る。\\n"+
      "これならそのまま使えるはず。");
  }
}
function startListening(){
  if(!SR){ setStatus("この環境では音声入力が使えないみたい。"); showVoiceHelp("この環境は音声入力に非対応"); return; }
  if(listening){ stopListening(); return; }
  try{
    recog=new SR();
    recog.lang="ja-JP"; recog.continuous=false; recog.interimResults=true; recog.maxAlternatives=1;
    let finalText="";
    recog.onstart=()=>{ listening=true; micBtn.classList.add("on"); setStatus("🎤 聞いてるよ…（話してね）"); clearTimeout(startWatch); };
    recog.onresult=(e)=>{
      let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript;
      }
      inputEl.value=(finalText+interim); autoGrow();
      sendEl.disabled=(inputEl.value.trim()===""&&!pendingFile)||busy;
    };
    recog.onerror=(e)=>{
      clearTimeout(startWatch); listening=false; micBtn.classList.remove("on");
      const er=(e&&e.error)?e.error:"不明";
      setStatus("音声入力エラー: "+er);
      if(er==="not-allowed"||er==="service-not-allowed") showVoiceHelp("マイクの許可が下りなかった: "+er);
      else if(er==="no-speech") setStatus("声が聞き取れなかったよ。もう一度試してね。");
      else showVoiceHelp("エラー: "+er);
    };
    recog.onend=()=>{
      listening=false; micBtn.classList.remove("on"); clearTimeout(recogTimer); clearTimeout(startWatch);
      if((statusEl.textContent||"").indexOf("聞いてる")>=0) setStatus(inputEl.value.trim()?"声を文字にしたよ。送信ボタンで送ってね。":"");
    };
    setStatus("🎤 マイクを準備中…");
    recog.start();
    recogTimer=setTimeout(()=>{ try{recog.stop();}catch(e){} }, 10000); // iOS対策: 10秒で自動停止
    // 起動監視: 2.5秒たっても開始しなければ「枠の制限で動かない」とみなす
    startWatch=setTimeout(()=>{
      if(!listening){
        try{recog.stop();}catch(e){}
        micBtn.classList.remove("on");
        setStatus("マイクが起動しなかったよ。");
        showVoiceHelp(inFrame?"アプリの表示枠がマイクを許可していない可能性":"マイクが起動しない");
      }
    }, 2500);
  }catch(err){
    listening=false; micBtn.classList.remove("on"); clearTimeout(startWatch);
    setStatus("音声入力を開始できなかった: "+((err&&err.message)||""));
    showVoiceHelp("開始できなかった: "+((err&&err.message)||""));
  }
}
micBtn.addEventListener("click", startListening);

/* ---------- slide creation (PowerPoint) ---------- */
const slideBtn=document.getElementById("slideBtn");
const slideModal=document.getElementById("slideModal");
const slideTopic=document.getElementById("slideTopic");
const slideMake=document.getElementById("slideMake");
const slideCancel=document.getElementById("slideCancel");
const slideNote=document.getElementById("slideNote");

slideBtn.addEventListener("click",()=>{ slideModal.hidden=false; setTimeout(()=>slideTopic.focus(),50); });
slideCancel.addEventListener("click",()=>{ slideModal.hidden=true; });
slideModal.addEventListener("click",(e)=>{ if(e.target===slideModal) slideModal.hidden=true; });

const SLIDE_SYS = `あなたはプレゼン資料の構成作成者です。次の依頼に基づき、PowerPointスライドの構成をJSONだけで出力してください。
出力はJSONのみ。前後に説明文やコードブロック記号(\`\`\`)を絶対に付けないこと。
スキーマ:
{"title":"表紙タイトル","subtitle":"表紙サブタイトル(任意・空文字可)","slides":[{"heading":"スライド見出し","bullets":["箇条書き1","箇条書き2"]}]}
ルール: 日本語。slidesは4〜7枚。1枚あたりbulletsは3〜5個。各bulletは1行で簡潔に(長文禁止)。依頼にない数値や事実を創作しないこと。`;

async function buildPptx(data){
  const pptx=new PptxGenJS();
  pptx.layout="LAYOUT_4x3";
  const F="游ゴシック";
  const cover=pptx.addSlide();
  cover.background={color:"FBF4E7"};
  cover.addText(String(data.title||"スライド"),{x:0.6,y:2.5,w:9,h:1.3,fontFace:F,fontSize:24,bold:true,color:"3A322A",align:"center",valign:"middle"});
  if(data.subtitle) cover.addText(String(data.subtitle),{x:0.6,y:3.9,w:9,h:0.8,fontFace:F,fontSize:16,color:"6B5F51",align:"center"});
  (data.slides||[]).forEach(sl=>{
    const s=pptx.addSlide();
    s.background={color:"FFFFFF"};
    s.addText(String(sl.heading||""),{x:0.6,y:0.5,w:8.8,h:0.9,fontFace:F,fontSize:20,bold:true,color:"A44E2A",valign:"middle"});
    s.addShape(pptx.ShapeType.line,{x:0.6,y:1.45,w:8.8,h:0,line:{color:"C9683D",width:1.5}});
    const items=(sl.bullets||[]).map(b=>({text:String(b),options:{bullet:{code:"2022"},fontFace:F,fontSize:16,color:"3A322A",paraSpaceAfter:12,breakLine:true}}));
    if(items.length) s.addText(items,{x:0.9,y:1.8,w:8.2,h:5.0,valign:"top"});
  });
  return await pptx.write({outputType:"blob"});
}

function addDownloadBubble(filename, url, n){
  const row=document.createElement("div"); row.className="row ai";
  const mini=document.createElement("div"); mini.className="mini"; mini.textContent="話";
  const b=document.createElement("div"); b.className="bubble";
  const t=document.createElement("div"); t.textContent="スライドができたよ！（"+(n||0)+"枚）下のボタンから保存してね。";
  b.appendChild(t);
  const a=document.createElement("a"); a.href=url; a.download=filename; a.className="dl-link"; a.textContent="📥 "+filename; a.target="_blank"; a.rel="noopener";
  b.appendChild(a);
  row.appendChild(mini); row.appendChild(b);
  logEl.appendChild(row); mainEl.scrollTop=mainEl.scrollHeight;
}

async function makeSlides(){
  const topic=slideTopic.value.trim();
  if(!topic){ slideNote.textContent="作りたいスライドの内容を書いてね。"; return; }
  if(typeof PptxGenJS==="undefined"){ slideNote.textContent="スライド作成ライブラリを読み込めなかったみたい。ネット接続を確認して、開き直してね。"; return; }
  slideMake.disabled=true; slideNote.textContent="…内容を考えてるよ";
  try{
    const raw=await callClaude([{role:"user", content:topic}], SLIDE_SYS);
    let txt=(raw||"").replace(/```json/gi,"").replace(/```/g,"").trim();
    const a=txt.indexOf("{"), z=txt.lastIndexOf("}");
    if(a>=0 && z>a) txt=txt.slice(a,z+1);
    const json=JSON.parse(txt);
    slideNote.textContent="…スライドを組み立ててるよ";
    const blob=await buildPptx(json);
    const fname=(String(json.title||"スライド").replace(/[\\/:*?"<>|\s]/g,"_").slice(0,40))+".pptx";
    const url=URL.createObjectURL(blob);
    slideModal.hidden=true; slideMake.disabled=false; slideNote.textContent=""; slideTopic.value="";
    addDownloadBubble(fname, url, (json.slides||[]).length);
    history.push({role:"assistant", content:"「"+(json.title||topic)+"」のスライドを作ったよ。"});
    await saveMemory();
  }catch(err){
    slideMake.disabled=false;
    const m=(err&&err.message)?err.message:"原因不明";
    slideNote.textContent="うまく作れなかった…（"+m+"）";
    console.error("makeSlides failed:", err);
  }
}
slideMake.addEventListener("click", makeSlides);

(async function init(){
  setState("idle");
  await loadMemory();
  greet(false);
  await saveMemory();
})();
</script>
</body>
