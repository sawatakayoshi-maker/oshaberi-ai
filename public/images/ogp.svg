<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OGPプレースホルダ。1200x630。PNGに書き出して /public/images/ogp.png として使用（[要確認]）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#EFEFEC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 部署カラーの帯 -->
  <g>
    <rect x="0" y="0" width="1200" height="12" fill="#1F2A44"/>
    <rect x="0"   y="0" width="171" height="12" fill="#D7263D"/>
    <rect x="171" y="0" width="171" height="12" fill="#E8743B"/>
    <rect x="342" y="0" width="171" height="12" fill="#3FA66A"/>
    <rect x="513" y="0" width="171" height="12" fill="#2D7DD2"/>
    <rect x="684" y="0" width="171" height="12" fill="#F2B705"/>
    <rect x="855" y="0" width="171" height="12" fill="#7A4FB5"/>
  </g>
  <!-- キャラ風の丸 -->
  <g>
    <circle cx="250" cy="430" r="64" fill="#D7263D"/>
    <circle cx="370" cy="430" r="64" fill="#E8743B"/>
    <circle cx="490" cy="430" r="64" fill="#3FA66A"/>
    <circle cx="610" cy="430" r="64" fill="#F2B705"/>
    <circle cx="730" cy="430" r="64" fill="#7A4FB5"/>
    <circle cx="850" cy="430" r="64" fill="#2D7DD2"/>
    <circle cx="970" cy="430" r="64" fill="#1F2A44"/>
  </g>
  <text x="100" y="210" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-size="40" fill="#6B6B66" font-weight="700">アセアンテクノロジー株式会社｜採用</text>
  <text x="100" y="300" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-size="66" fill="#2B2B2B" font-weight="800">国籍も、経験も、</text>
  <text x="100" y="372" font-family="'Yu Gothic','Hiragino Sans',sans-serif" font-size="66" fill="#E8743B" font-weight="800">ここでは強みになる。</text>
  <text x="100" y="590" font-family="sans-serif" font-size="26" fill="#6B6B66">ASEAN Technology — Careers</text>
</svg>
