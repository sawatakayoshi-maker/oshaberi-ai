<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 2x2 スプライトシート。0:待機 1:発話(閉) 2:発話(開) 3:考え中 -->
  <defs>
    <g id="base">
      <circle cx="50" cy="50" r="46" fill="#eef0f6"/>
      <circle cx="50" cy="54" r="26" fill="#f5d9c4"/>
      <path d="M24 50 Q26 22 50 22 Q74 22 76 50 Q68 36 50 34 Q32 36 24 50 Z" fill="#3a2a22"/>
      <circle cx="40" cy="46" r="2.6" fill="#2a2a2e"/>
      <circle cx="60" cy="46" r="2.6" fill="#2a2a2e"/>
    </g>
  </defs>

  <!-- 0: 待機（top-left） -->
  <g transform="translate(0,0)">
    <use href="#base"/>
    <path d="M44 64 Q50 69 56 64" stroke="#b5524a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 1: 発話・口閉じ（top-right） -->
  <g transform="translate(100,0)">
    <use href="#base"/>
    <line x1="45" y1="64" x2="55" y2="64" stroke="#b5524a" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 2: 発話・口開き（bottom-left） -->
  <g transform="translate(0,100)">
    <use href="#base"/>
    <ellipse cx="50" cy="65" rx="5.5" ry="4.5" fill="#b5524a"/>
  </g>

  <!-- 3: 考え中（bottom-right） -->
  <g transform="translate(100,100)">
    <use href="#base"/>
    <line x1="35" y1="39" x2="45" y2="37" stroke="#7a6a60" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="55" y1="37" x2="65" y2="39" stroke="#7a6a60" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="46" y1="64" x2="52" y2="63" stroke="#b5524a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="30" r="1.8" fill="#8e8e93"/>
    <circle cx="86" cy="26" r="1.3" fill="#8e8e93"/>
  </g>
</svg>
