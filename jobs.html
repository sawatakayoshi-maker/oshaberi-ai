<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>働き方・職種｜アセアンテクノロジー 採用サイト</title>
  <meta name="description" content="請負スタッフ／オンサイト派遣／内職／リーダー／営業／経理事務／通訳・多言語サポート。あなたに合う働き方を見つけてください。" />
  <meta property="og:title" content="働き方・職種｜アセアンテクノロジー" />
  <meta property="og:description" content="あなたに合う働き方を。" />
  <meta property="og:image" content="/public/images/ogp.png" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <!-- JobPosting 構造化データの雛形（値は[要確認]）。職種ごとに整備予定。 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "JobPosting",
    "title": "[要確認] 職種名",
    "description": "[要確認] 仕事内容",
    "hiringOrganization": { "@type": "Organization", "name": "アセアンテクノロジー株式会社" },
    "jobLocation": {
      "@type": "Place",
      "address": { "@type": "PostalAddress", "addressLocality": "福井市", "addressRegion": "福井県", "addressCountry": "JP" }
    },
    "employmentType": "[要確認]",
    "datePosted": "[要確認]"
  }
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="container page-head__inner">
        <p class="eyebrow">ROLES</p>
        <h1>働き方・職種</h1>
        <p>未経験から始める人も、語学をいかしたい人も。
          あなたの「得意」が活きる場所を選べます。（採用条件の詳細は確認中）</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="jobs-grid" class="grid grid--3"></div>
        <p class="muted" style="margin-top:24px">
          <span class="req-flag">未経験可否</span> や応募条件は <span class="todo-inline">[要確認]</span> です。
          確定し次第、各カードに反映します。
        </p>
      </div>
    </section>
  </main>

  <a class="btn btn--primary cta-fixed" href="/entry.html" data-i18n="cta.entry">エントリー</a>
  <div id="site-footer"></div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
