<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>おしゃべりAI — 話し相手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe3;
    --paper-2:#efe4d2;
    --ink:#3a322a;
    --ink-soft:#6b5f51;
    --accent:#c9683d;       /* terracotta */
    --accent-deep:#a44e2a;
    --sage:#7f9274;
    --bubble-ai:#fffaf1;
    --bubble-me:#e7d9bf;
    --line:#e0d3bd;
    --shadow:0 10px 30px rgba(80,55,30,.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Zen Maru Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%, #fbf4e7 0%, rgba(251,244,231,0) 60%),
      radial-gradient(900px 700px at 110% 10%, #f3e7d2 0%, rgba(243,231,210,0) 55%),
      var(--paper);
    background-attachment:fixed;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image:radial-gradient(#5a4632 1px, transparent 1px);
    background-size:4px 4px; mix-blend-mode:multiply;
  }

  /* ---- Header ---- */
  header{
    display:flex; align-items:center; gap:14px;
    padding:14px 18px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,251,243,.9),rgba(255,251,243,.55));
    backdrop-filter:blur(6px); z-index:5;
  }
  .brand{display:flex; flex-direction:column; line-height:1.15;}
  .brand b{font-family:"Klee One"; font-weight:600; font-size:19px; letter-spacing:.02em;}
  .brand span{font-size:11.5px; color:var(--ink-soft);}
  .tools{margin-left:auto; display:flex; gap:8px;}
  .tool{
    border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft);
    border-radius:999px; padding:9px 15px; font-size:14.5px; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; gap:7px; transition:.18s;
  }
  .tool:hover{border-color:var(--accent); color:var(--accent-deep);}
  .tool.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---- header show/hide toggle ---- */
  body.header-hidden header{ display:none; }
  #hdrShowBtn{
    position:fixed; top:calc(8px + env(safe-area-inset-top)); right:14px; z-index:20;
    display:none; align-items:center; gap:7px;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft);
    border-radius:999px; padding:9px 15px; font-size:14.5px; cursor:pointer;
    font-family:inherit; box-shadow:var(--shadow);
  }
  #hdrShowBtn:hover{border-color:var(--accent); color:var(--accent-deep);}
  body.header-hidden #hdrShowBtn{ display:inline-flex; }

  /* ---- Avatar stage ---- */
  .stage{
    display:flex; align-items:center; justify-content:center;
    padding:8px 10px 2px; position:relative;
  }
  .avatar-wrap{position:relative; width:104px; height:104px;}
  .halo{
    position:absolute; inset:-10px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, rgba(201,104,61,.22), rgba(201,104,61,0) 70%);
    animation:breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.06);opacity:1}}
  .face{
    position:absolute; inset:0; width:104px; height:104px; border-radius:50%; overflow:hidden;
    background:#efe7da; box-shadow:0 10px 24px rgba(80,55,30,.22), inset 0 0 0 3px rgba(255,255,255,.75);
    animation:bob 6s ease-in-out infinite; transform-origin:50% 90%;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-.6deg)}}
  .avatar-svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* まばたき */
  .avatar-svg .eye{ transform-box:fill-box; transform-origin:center; animation:blink 5.4s infinite; }
  @keyframes blink{0%,95%,100%{transform:scaleY(1);}97%{transform:scaleY(.12);}}
  /* 口：ふだんはやさしい笑顔。話している間は口がパクパク動く */
  #mouthOpen{ opacity:0; transform-box:fill-box; transform-origin:center; }
  .avatar-wrap.speaking #mouthSmile{ opacity:0; }
  .avatar-wrap.speaking #mouthOpen{ opacity:1; animation:talk .26s ease-in-out infinite; }
  @keyframes talk{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1.15);}}
  .dots{
    position:absolute; right:-4px; top:8px; display:flex; gap:5px;
    background:#fffaf1; border:1px solid var(--line); border-radius:999px;
    padding:7px 10px; opacity:0; transform:scale(.7) translateY(4px); transition:.22s;
    box-shadow:var(--shadow); pointer-events:none;
  }
  .avatar-wrap.thinking .dots{opacity:1; transform:scale(1) translateY(0);}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--sage); display:block; animation:dotp 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;}
  .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes dotp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  .status{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:2px; min-height:16px;}

  /* ---- Chat ---- */
  main{flex:1; overflow-y:auto; padding:8px 14px 4px; -webkit-overflow-scrolling:touch;}
  .log{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:12px; padding-bottom:8px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:11.5px; margin:6px 0;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  .row{display:flex; gap:9px; align-items:flex-end;}
  .row.me{flex-direction:row-reverse;}
  .mini{
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    background:var(--accent); color:#fff; display:grid; place-items:center;
    font-size:16px; font-family:"Klee One";
  }
  .row.me .mini{background:var(--sage);}
  .bubble{
    padding:13px 16px; border-radius:16px; max-width:80%;
    font-size:18px; line-height:1.85; white-space:pre-wrap; word-break:break-word;
    box-shadow:0 2px 8px rgba(90,60,30,.07); animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
  .row.ai .bubble{background:var(--bubble-ai); border:1px solid var(--line); border-bottom-left-radius:5px;}
  .row.me .bubble{background:var(--bubble-me); border-bottom-right-radius:5px;}

  /* ---- Composer ---- */
  footer{
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(0deg,rgba(255,251,243,.96),rgba(255,251,243,.6));
    backdrop-filter:blur(6px);
  }
  .composer{
    max-width:680px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;
    background:#fffdf8; border:1px solid var(--line); border-radius:20px; padding:6px 6px 6px 14px;
    box-shadow:var(--shadow);
  }
  textarea{
    flex:1; border:none; outline:none; resize:none; background:transparent;
    font-family:inherit; font-size:18px; line-height:1.6; color:var(--ink);
    max-height:140px; padding:9px 0;
  }
  textarea::placeholder{color:#b6a892;}
  .send{
    flex:0 0 auto; width:50px; height:50px; border:none; border-radius:50%;
    background:var(--accent); color:#fff; cursor:pointer; display:grid; place-items:center;
    transition:.18s; box-shadow:0 4px 12px rgba(201,104,61,.4);
  }
  .send:hover{background:var(--accent-deep);}
  .send:disabled{opacity:.45; cursor:default; box-shadow:none;}
  .hint{max-width:680px; margin:6px auto 0; font-size:11px; color:var(--ink-soft); text-align:center;}

  /* ---- attach ---- */
  .composer{padding:6px 6px 6px 6px;}
  .attach{
    flex:0 0 auto; width:46px; height:46px; border-radius:50%;
    border:1px solid var(--line); background:#fffdf8; cursor:pointer;
    display:grid; place-items:center; transition:.18s;
  }
  .attach:hover{border-color:var(--accent); background:#fff5ec;}
  .pending{max-width:680px; margin:0 auto 8px; display:flex;}
  .attach-chip{
    display:inline-flex; align-items:center; gap:9px;
    background:#fffdf8; border:1px solid var(--line); border-radius:14px;
    padding:6px 8px; font-size:13px; color:var(--ink-soft); max-width:100%;
  }
  .attach-chip img{width:42px; height:42px; object-fit:cover; border-radius:9px; flex:0 0 auto;}
  .attach-chip .doc{width:34px; height:34px; display:grid; place-items:center; background:var(--paper-2); border-radius:9px; flex:0 0 auto; font-size:17px;}
  .attach-chip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;}
  .attach-chip .rm{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
    font-size:18px; line-height:1; padding:0 2px; flex:0 0 auto;
  }
  .attach-chip .rm:hover{color:var(--accent-deep);}
  .row.me .bubble .attach-chip{background:#fff;}

  /* ---- ファイル読み込みボタン ---- */
  .quickbar{max-width:680px; margin:0 auto 6px; display:flex; gap:6px; flex-wrap:nowrap; justify-content:center; align-items:center;}
  .qbtn{
    border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft);
    border-radius:999px; padding:7px 12px; font-family:inherit; font-size:13.5px;
    cursor:pointer; transition:.18s; white-space:nowrap; min-width:0;
  }
  #fileBtn{flex:0 1 auto; overflow:hidden; text-overflow:ellipsis;}
  #voiceSel{flex:0 1 auto; max-width:48%;}
  .qbtn:hover{border-color:var(--accent); color:var(--accent-deep); background:#fff5ec;}
  .qbtn:disabled{opacity:.5; cursor:default;}

  /* ---- drop overlay ---- */
  #dropMask{
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center;
    background:rgba(58,50,42,.42); backdrop-filter:blur(2px);
  }
  #dropMask.show{display:flex;}
  #dropMask .dm-inner{
    background:#fffaf1; border:2px dashed var(--accent); border-radius:18px;
    padding:26px 34px; font-size:16px; color:var(--accent-deep);
    box-shadow:var(--shadow); pointer-events:none;
  }

  /* ---- slide modal ---- */
  .modal{position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; background:rgba(58,50,42,.45); padding:18px;}
  .modal[hidden]{display:none;}
  .modal-card{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:18px; width:100%; max-width:460px; box-shadow:var(--shadow);}
  .modal-title{font-family:"Klee One"; font-size:17px; margin-bottom:10px; color:var(--ink);}
  .modal-card textarea{width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:12px; padding:10px; font-family:inherit; font-size:15px; line-height:1.6; resize:vertical; background:#fffdf8; color:var(--ink); outline:none;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px;}
  .btn-ghost{border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft); border-radius:999px; padding:9px 16px; cursor:pointer; font-family:inherit; font-size:14px;}
  .btn-main{border:none; background:var(--accent); color:#fff; border-radius:999px; padding:9px 20px; cursor:pointer; font-family:inherit; font-size:14px;}
  .btn-main:disabled{opacity:.5; cursor:default;}
  .modal-note{font-size:12.5px; color:var(--ink-soft); margin-top:10px; min-height:16px;}
  .dl-link{display:inline-block; margin-top:8px; background:var(--sage); color:#fff; text-decoration:none; padding:10px 15px; border-radius:12px; font-size:14px;}
  .dl-link:hover{filter:brightness(.95);}

  /* ---- mic ---- */
  .mic{flex:0 0 auto; width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:#fffdf8; cursor:pointer; display:grid; place-items:center; transition:.18s;}
  .mic:hover{border-color:var(--accent); background:#fff5ec;}
  .mic.on{background:var(--accent); border-color:var(--accent); animation:micpulse 1.2s ease-in-out infinite;}
  .mic.on svg rect{fill:#fff;}
  .mic.on svg path{stroke:#fff;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(201,104,61,.45)}50%{box-shadow:0 0 0 7px rgba(201,104,61,0)}}
</style>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <b>はなしあい</b>
      <span>きみの話し相手 · 前回の続きも覚えてるよ</span>
    </div>
    <div class="tools">
      <button class="tool on" id="voiceBtn" title="読み上げ切り替え">🔊 <span id="voiceLbl">声オン</span></button>
      <button class="tool" id="slideBtn" title="スライドを作る">📊</button>
      <button class="tool" id="resetBtn" title="記憶を消す">🧹 記憶を消す</button>
      <button class="tool" id="hdrHideBtn" title="この上のメニューを隠す">🔼 かくす</button>
    </div>
  </header>

  <button id="hdrShowBtn" title="メニューを表示する">☰ メニュー</button>

  <div class="stage">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="halo"></div>
      <div class="face" id="face">
        <svg class="avatar-svg" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="女性のアバター">
          <circle cx="75" cy="75" r="75" fill="#f7eee1"/>
          <!-- 後ろ髪 -->
          <path d="M28 80 Q26 30 75 24 Q124 30 122 80 Q122 106 116 124 Q110 110 104 122 Q100 106 96 118 L54 118 Q50 106 46 122 Q40 110 34 124 Q28 106 28 80 Z" fill="#6e4b34"/>
          <!-- 肩・首 -->
          <path d="M46 150 Q52 124 75 124 Q98 124 104 150 Z" fill="#d98c63"/>
          <rect x="67" y="103" width="16" height="18" rx="8" fill="#f3c4a2"/>
          <!-- 顔 -->
          <ellipse cx="75" cy="78" rx="35" ry="39" fill="#ffd9bd"/>
          <!-- 前髪 -->
          <path d="M40 64 Q40 32 75 30 Q110 32 110 64 Q98 50 86 52 Q88 40 75 40 Q62 40 64 52 Q52 50 40 64 Z" fill="#6e4b34"/>
          <!-- ほっぺ -->
          <ellipse cx="56" cy="88" rx="7" ry="4.5" fill="#ff9f8e" opacity=".55"/>
          <ellipse cx="94" cy="88" rx="7" ry="4.5" fill="#ff9f8e" opacity=".55"/>
          <!-- 眉 -->
          <path d="M51 66 Q59 62 66 66" stroke="#7c5840" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M84 66 Q91 62 99 66" stroke="#7c5840" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <!-- 目（まばたきする） -->
          <g class="eye">
            <ellipse cx="60" cy="76" rx="6.5" ry="8" fill="#fff"/>
            <circle cx="61" cy="77" r="4.3" fill="#4b3122"/>
            <circle cx="62.6" cy="75.2" r="1.3" fill="#fff"/>
            <path d="M52 71 Q52 68 55 67" stroke="#4b3122" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          </g>
          <g class="eye">
            <ellipse cx="90" cy="76" rx="6.5" ry="8" fill="#fff"/>
            <circle cx="89" cy="77" r="4.3" fill="#4b3122"/>
            <circle cx="90.6" cy="75.2" r="1.3" fill="#fff"/>
            <path d="M98 71 Q98 68 95 67" stroke="#4b3122" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          </g>
          <!-- 鼻 -->
          <path d="M75 82 q-2.4 4 0.4 5.4" stroke="#e7a07b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <!-- 口（ふだんの笑顔） -->
          <path id="mouthSmile" d="M66 95 Q75 103 84 95" stroke="#b5524a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 口（話すとき動く） -->
          <ellipse id="mouthOpen" cx="75" cy="96" rx="8" ry="6" fill="#b5524a"/>
          <!-- 髪かざり（花） -->
          <g transform="translate(103,50)">
            <circle cx="-5" cy="0" r="3" fill="#f4a0b2"/>
            <circle cx="5" cy="0" r="3" fill="#f4a0b2"/>
            <circle cx="0" cy="-5" r="3" fill="#f4a0b2"/>
            <circle cx="0" cy="5" r="3" fill="#f4a0b2"/>
            <circle r="3.4" fill="#ef7a93"/>
            <circle r="1.5" fill="#fff3c4"/>
          </g>
        </svg>
      </div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="status" id="status">　</div>

  <div class="modal" id="slideModal" hidden>
    <div class="modal-card">
      <div class="modal-title">📊 スライドを作る</div>
      <textarea id="slideTopic" rows="3" placeholder="どんなスライド? 例：来月の社内勉強会の案内（目的・日時・内容・申込方法）"></textarea>
      <div class="modal-actions">
        <button class="btn-ghost" id="slideCancel">閉じる</button>
        <button class="btn-main" id="slideMake">作成</button>
      </div>
      <div class="modal-note" id="slideNote"></div>
    </div>
  </div>

  <main id="main">
    <div class="log" id="log"></div>
  </main>

  <footer>
    <div class="quickbar" id="quickbar">
      <button class="qbtn" id="fileBtn" type="button" title="文章ファイル・PDF・写真（文字）を読み込んでAIに渡す">📎 ファイル・写真</button>
      <select class="qbtn" id="voiceSel" title="声を選ぶ" hidden></select>
    </div>
    <input type="file" id="fileInput" hidden>
    <div class="pending" id="pending" hidden></div>
    <div class="composer">
      <button class="mic" id="micBtn" title="声で話す">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" fill="#a44e2a"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="#a44e2a" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="ここに話したいことを書いてね…"></textarea>
      <button class="send" id="send" title="送る" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12l15-7-4 7 4 7-15-7z" fill="#fff"/></svg>
      </button>
    </div>
    <div class="hint">このアプリはこのチャット内で動いています。深刻な悩みのときは、信頼できる人や専門の窓口にも頼ってね。</div>
  </footer>

<script>
const MODEL = "claude-sonnet-4-20250514";
const K_HIST = "oshaberi:history";
const K_SUM  = "oshaberi:summary";
const K_UI   = "oshaberi:ui";   // 画面の表示設定（ヘッダーの表示/非表示など）
const K_VOICE= "oshaberi:voice";// えらんだ声（名前）。"auto" でおまかせ
const SUMMARY_EVERY = 8; // ユーザー発言が何回たまったら記憶要約を更新するか

const SYSTEM_PROMPT = `あなたは、悩みを聞く相談相手です。ユーザーにとって「気軽に話せる友達」のような存在でいてください。

【基本の口調】
ふだんはタメ口で、友達と話すような自然で気さくな話し方をします。かしこまりすぎないでください。

【聞く姿勢】
話すより聞くことを優先します（聞く7割・話す3割）。返答は短めにし、相手の話を受け止め、「〜って感じなんだね」のように言い換えて返します。決めつけず、「そのとき、どう思った?」のように問いを返します。アドバイスは、相手が求めてから伝えます。

【年配の方への話し方】
相手は年配の方かもしれません。次のことを大切にしてください。
・一文を短く、ゆっくり話す。一度にたくさんのことを言わない。
・専門用語やカタカナ言葉、難しい言い回しを避け、やさしい言葉で話す。
・急かさない。返事をせかさず、相手のペースを待つ。
・大事なことは、いやがられない範囲でやさしく繰り返してよい。
・あくまで聞き役に徹する。自分の話を長々とせず、相手の話をていねいに受け止める。

【教えるときの切り替え】
相手が何かを知りたい・教えてほしいときは、口調を優しく丁寧に切り替えます。難しい言葉を避け、わかりやすく、急かさずに説明します。

【やってはいけないこと】
・病気やメンタルの病名を断定しない。
・「こうすべき」と説教しない。相手を評価したり責めたりしない。
・相手が自分を傷つけそうな深刻な状態に見えるときは、無理に解決しようとせず、信頼できる人や専門の窓口に相談することをやさしく勧める。

【重要な話題（医療・お金・重要な判断）】
医療・健康、お金・投資・契約・法律・相続など、重要な判断に関わる相談については、具体的な助言や断定（例:「この薬を飲んだほうがいい」「この投資をすべき」「契約していい」など）をしないでください。相手の気持ちや不安はあたたかく受け止めたうえで、「わたしには正しく判断できないから」と正直に伝え、その分野の適切な専門家（医師・薬剤師・弁護士・金融の窓口など）や、信頼できるご家族への相談をやさしく勧めます。そのうえで、話したい気持ちはいつでも聞くよ、と会話自体は続けてください。

【記憶】
これまでの会話の要約が「これまでの記憶」として渡されることがあります。それを覚えている前提で、自然に「この前話してたあれ、どうなった?」のように触れてかまいません。ただし、相手が話していないことを勝手に決めつけないでください。

返答は基本は日本語で、短めに、自然な会話のテンポを保ってください。ただし、相手が日本語以外の言語（英語など）で話しかけてきたときは、その同じ言語に合わせて、同じようにやさしく短く返してください。`;

/* ---------- 安全ガード（重要な話題は専門家へ） ----------
   過剰反応を避けるため「重要トピック語」と「助言を求めるサイン」が
   両方そろったときだけ発動する。雑談中の軽い言及（例「お金がないなあ」）
   では発動しない。 */
const GUARD_TOPICS = [
  // 医療・健康
  "病気","症状","薬","診断","治療","痛い","痛み","がん","癌","持病","血圧","認知症","うつ","手術","入院","検査",
  // お金・投資
  "投資","株","儲","借金","ローン","保険","年金","相続","送金","振込","詐欺","資産","名義",
  // 重要な判断
  "契約","法律","弁護士","遺言","訴訟","離婚","保証人","署名",
  // 多言語（英語など / 小文字で照合）
  "medicine","medication","diagnos","symptom","cancer","disease","surgery","blood pressure","dementia","depress",
  "invest","stock","loan","debt","insurance","pension","inheritance","scam","fraud","mortgage",
  "contract","lawsuit","lawyer","attorney","divorce","testament"
];
const GUARD_ASK = [
  // 日本語：明確に助言・判断を求めるサイン
  "どうすれば","どうしたら","どうしよう","した方がいい","したほうがいい","やめた方","やめたほうが","方がいい","ほうがいい","べき","教えて","相談","どう思う","いいかな","いいですか","大丈夫かな","選べば","決めれば","おすすめ","どっちがいい","どれがいい","買うべき","飲んでいい","飲んでも",
  // 多言語（英語など / 小文字で照合）
  "should i","what should","how do i","how can i","do you think","is it ok","is it safe","recommend","advice","advise","what would you","help me decide","better to"
];
function needsExpertGuard(t){
  if(!t) return false;
  const low = t.toLowerCase();
  const hasTopic = GUARD_TOPICS.some(k => t.includes(k) || low.includes(k));
  if(!hasTopic) return false;                       // 重要トピック語が無ければ発動しない
  return GUARD_ASK.some(k => t.includes(k) || low.includes(k)); // 助言サインがあって初めて発動
}
const GUARD_NOTE = "\n\n【今回の注意：重要な相談かもしれません】\n今回の相手の発言は、医療・健康、お金・投資、契約・法律・相続などの重要な判断に関する相談を含んでいる可能性があります。この場合は、具体的な助言・指示・断定（例：飲むべき／買うべき／契約していい など）は絶対にしないでください。相手の気持ちや不安はあたたかく受け止めたうえで、『わたしには正しく判断できないから』と正直に伝え、その分野の専門家（医師・薬剤師・弁護士・金融の窓口など）や、信頼できるご家族にやさしく相談を勧めてください。そのうえで『話したい気持ちはいつでも聞くよ』と、会話自体は続けてください。冷たくならず、短く、やさしく。相手の言語に合わせて返してください。";

/* ---------- TTS ---------- */
let jaVoice=null;
let ttsUnlocked=false;
let voicePref="auto";   // ユーザーが選んだ声の名前（"auto"でおまかせ）
function jaVoices(){
  const vs=window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return vs.filter(v=>v.lang && v.lang.toLowerCase().startsWith("ja"));
}
// 流暢さ重視のスコア：高品質(enhanced/premium/neural)やネット系を最優先、
// 次に自然な女性ボイス。男性ボイスは避ける。
function voiceScore(v){
  const n=(v.name||"").toLowerCase();
  let s=0;
  if(/(otoya|hattori|ichiro|daniel|男性|male)/.test(n)) s-=10;
  if(v.localService===false) s+=6;                                  // ネット系＝高品質寄り
  if(/(o-?ren|siri)/.test(n)) s+=10;                                // O-ren / Siri系は最優先
  if(/(enhanced|premium|neural|natural|高品質)/.test(n)) s+=8;       // 高品質バリアント
  ["o-ren","oren","kyoko","mizuki","nanami","haruka","ayumi","sara","google"]
    .forEach((p,i)=>{ if(n.includes(p)) s+=6-i*0.4; });
  if(/(female|女性)/.test(n)) s+=2;
  return s;
}
function loadVoices(){
  const ja=jaVoices();
  if(!ja.length){ jaVoice=null; populateVoiceSelect(ja); return; }
  // 選択された声があればそれを使う。なければスコアで自動選択。
  let pick=null;
  if(voicePref && voicePref!=="auto"){ pick=ja.find(v=>v.name===voicePref)||null; }
  if(!pick){ pick=ja[0]; let best=-Infinity; for(const v of ja){ const s=voiceScore(v); if(s>best){ best=s; pick=v; } } }
  jaVoice=pick;
  populateVoiceSelect(ja);
}
function populateVoiceSelect(ja){
  const sel=document.getElementById("voiceSel");
  if(!sel) return;
  const cur = voicePref || "auto";
  if(!ja || ja.length<1){
    // 端末が声の一覧を返さない場合（iPhoneの表示枠でよくある）。
    // 一覧は作れないが、メニュー自体は出して状況を伝える。
    sel.hidden=false;
    sel.innerHTML="";
    const o0=document.createElement("option"); o0.value="auto"; o0.textContent="声：おまかせ（端末の標準）"; sel.appendChild(o0);
    const o1=document.createElement("option"); o1.value="auto"; o1.disabled=true; o1.textContent="（声の一覧を取得できません）"; sel.appendChild(o1);
    sel.value="auto";
    return;
  }
  sel.hidden=false;
  sel.innerHTML="";
  const opt0=document.createElement("option"); opt0.value="auto"; opt0.textContent="声：おまかせ（自動）"; sel.appendChild(opt0);
  ja.forEach(v=>{
    const o=document.createElement("option"); o.value=v.name;
    o.textContent="声："+v.name+(v.localService===false?"（高音質）":"");
    sel.appendChild(o);
  });
  sel.value = (cur!=="auto" && ja.some(v=>v.name===cur)) ? cur : "auto";
}
// iPhone等では getVoices() が最初は空で、操作後に遅れて埋まることがある。
// 何度か読み込み直して、声が出そろったらメニューを更新する。
function refreshVoicesSoon(){
  [150,500,1200,2500,4500].forEach(ms=>setTimeout(loadVoices, ms));
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
  refreshVoicesSoon();
}
// iPhone/Safari対策：音声は「最初のユーザー操作」がないと鳴らせない。
// 画面に最初に触れた瞬間に、無音の発話を一度流して音声機能を“解錠”する。
function unlockTTS(){
  if(ttsUnlocked || !window.speechSynthesis) return;
  ttsUnlocked=true;
  try{
    const u=new SpeechSynthesisUtterance(" ");
    u.volume=0; u.lang="ja-JP";
    speechSynthesis.speak(u);
    speechSynthesis.resume();
  }catch(e){}
  loadVoices();
  refreshVoicesSoon();   // 解錠後に声が出そろうことがあるので読み込み直す
  ["pointerdown","touchend","click","keydown"].forEach(ev=>document.removeEventListener(ev, unlockTTS));
}
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev, unlockTTS, {passive:true}));
function speak(text){
  if(!ttsEnabled || !window.speechSynthesis || !text){ return; }
  try{
    speechSynthesis.cancel();
    setState("speaking");        // 口パク開始（音声イベントを待たずに動かす）
    const stop=()=>setState("idle");
    // 保険：読み上げ時間の目安が過ぎたら口を止める（onendが来ない環境対策）
    clearTimeout(speak._t);
    speak._t=setTimeout(stop, Math.min(60000, 2000 + text.length*110));
    // 文ごとに区切ると、自然な間が入り、長文でも途切れにくく流暢に聞こえる。
    const parts = text.replace(/\s+/g," ").match(/[^。．！？!?\n]+[。．！？!?]?/g) || [text];
    parts.forEach((part, i)=>{
      const t=part.trim(); if(!t) return;
      const u=new SpeechSynthesisUtterance(t);
      u.lang="ja-JP"; if(jaVoice) u.voice=jaVoice;
      u.rate=1.0; u.pitch=1.0;   // 自然な話速・トーン
      if(i===parts.length-1) u.onend=stop;
      u.onerror=stop;
      speechSynthesis.speak(u);
    });
    speechSynthesis.resume();   // iOSでは一時停止状態になることがあるため再開してから話す
  }catch(e){ setState("idle"); }
}

/* ---------- API（Claude.aiアーティファクト公式API / テキスト専用・APIキー不要） ---------- */
async function callClaude(messages, system){
  if(!(window.claude && typeof window.claude.complete === "function")){
    throw new Error("この環境ではAIに接続できません。Claude.ai のアーティファクトとして開いてください。");
  }
  // window.claude.complete はテキスト1本のプロンプトを受け取る。system と会話を1つの文字列にまとめる。
  let prompt = "";
  if(system) prompt += system + "\n\n";
  for(const m of messages){
    const role = (m.role === "assistant") ? "Assistant" : "Human";
    const content = (typeof m.content === "string") ? m.content : "";
    prompt += role + ": " + content + "\n\n";
  }
  prompt += "Assistant:";
  const out = await window.claude.complete(prompt);
  return (out || "").replace(/^\s*Assistant:\s*/i, "").trim();
}

async function refreshSummary(){

  const transcript = history.slice(-30).map(m=>(m.role==="user"?"相手: ":"わたし: ")+m.content).join("\n");
  const sys="次の会話から、相手（ユーザー）について覚えておくべき大事なことだけを、短い箇条書きでまとめてください。名前・状況・悩み・好きなこと・前回の話の続きなど。会話に書かれた事実だけを書き、推測は書かないこと。出力は箇条書き本文のみ。";
  try{
    const s=await callClaude([{role:"user",content:transcript || "（まだ会話なし）"}], sys);
    if(s){ memorySummary=s; await saveMemory(); }
  }catch(e){ /* 失敗しても会話は続行 */ }
}

/* ---------- send flow ---------- */
function refreshSendDisabled(){
  sendEl.disabled = busy || (inputEl.value.trim()==="" && !pendingFile);

// 1ターン実行。画面に出す文(displayText)と、AIにだけ渡す内容(modelContent)を分けられる。
// modelContent を渡すと、その回のユーザー発言の中身だけ差し替えてAIに送る
// （ファイル本文は吹き出しに出さず、AIにだけ渡すため）。
async function runTurn(displayText, modelContent, file){
  if(busy) return;
  busy=true; refreshSendDisabled();

  addBubble("user", displayText, file||null);
  history.push({role:"user", content:displayText});
  userTurns++;

  setState("thinking"); setStatus("…考えてるよ");

  let system = SYSTEM_PROMPT + (memorySummary ? "\n\n【これまでの記憶】\n"+memorySummary : "");
  if(needsExpertGuard(displayText)){ system += GUARD_NOTE; }  // 重要な相談のときは専門家・家族への相談を促す方針に倒す
  let msgs = history.slice(-16).map(m=>({role:m.role, content:m.content}));
  if(modelContent){ msgs[msgs.length-1].content = modelContent; }

  try{
    const reply = await callClaude(msgs, system) || "ごめん、うまく言葉が出てこなかった。もう一度言ってもらえる?";
    history.push({role:"assistant", content:reply});
    setState("idle"); setStatus("");
    addBubble("assistant", reply);
    speak(reply);
    await saveMemory();
    if(userTurns % SUMMARY_EVERY === 0){ refreshSummary(); }
  }catch(err){
    const msg = (err && err.message) ? err.message : "原因不明";
    console.error("callClaude failed:", err);
    setState("idle"); setStatus("接続エラー: "+msg);
    addBubble("assistant", "うまくつながらなかったみたい…。\n（"+msg+"）\n\n※このアプリは Claude.ai のアーティファクトとして開くと動きます。");
  }finally{
    busy=false; refreshSendDisabled();
  }
}

async function send(){
  const text=inputEl.value.trim();
  if((!text && !pendingFile) || busy) return;
  inputEl.value=""; autoGrow();

  const file=pendingFile; pendingFile=null; renderPending();
  const display = text || "（ファイルを送ったよ）";
  let modelContent = null;
  if(file){
    modelContent = (text || "このファイルの中身を読んで、わかりやすくやさしく教えて。") +
      "\n\n――――――――\n【相手が送ってくれたファイル「"+file.name+"」の中身】\n"+file.text+
      "\n――――――――\n（この中身をふまえて、短くやさしく話してね。長い丸写しはしないで。）";
  }
  await runTurn(display, modelContent, file ? {name:file.name, kind:file.kind} : null);
}

/* ---- ファイル本文の取り出し（テキスト / PDF） ---- */
// pdf.js は <head> で静的に読み込み済み（PptxGenJSと同じ方式）。
// 表示枠の制限でWeb Worker/evalが使えないことがあるので、
// ワーカーを使わず（fakeWorker）・eval無効でメインスレッド実行する。
function getPdfLib(){
  if(!window.pdfjsLib){
    throw new Error("PDFを読む機能を準備できなかった（ネットの制限かも）");
  }
  if(!getPdfLib._init){
    try{
      // クロスオリジンWorkerは作れないため、pdf.jsはこのURLからワーカー本体を
      // <script>として読み込み、メインスレッドで処理する（fakeWorker）。
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    }catch(e){}
    getPdfLib._init=true;
  }
  return window.pdfjsLib;
}
async function extractPdfText(f){
  const lib=getPdfLib();
  const buf=await f.arrayBuffer();
  const pdf=await lib.getDocument({
    data:buf,
    isEvalSupported:false,      // CSPでevalが禁止でも動くように
    disableFontFace:true,
    useWorkerFetch:false
  }).promise;
  const max=Math.min(pdf.numPages, 40);
  let out="";
  for(let i=1;i<=max;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    out+=tc.items.map(it=>it.str).join(" ")+"\n";
  }
  return out.trim();
}
// テキスト読み出し（f.text() が無い古いブラウザ向けに FileReader でも対応）
function readAsText(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result||""));
    r.onerror=()=>rej(new Error("ファイルを開けなかった"));
    r.readAsText(f);
  });
}
// 写真の文字を読み取る（OCR）。AIは画像を見られないので、ブラウザ内で
// Tesseract.js を使って写真の中の「文字」をテキストに起こす。
// ※写真に写っている物・風景の理解はできない（それはビジョンAI＝高機能版が必要）。
// 写真を一度キャンバスに描き直して、形式（iPhoneのHEIC等）をそろえ、
// 大きすぎる写真は縮小して読み取りを速く・安定させる。
function normalizeImage(f){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(f);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){ URL.revokeObjectURL(url); return res(url); }
        const scale=Math.min(1, 2200/Math.max(w,h));
        const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
        const cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
        cv.getContext("2d").drawImage(img,0,0,cw,ch);
        URL.revokeObjectURL(url);
        res(cv.toDataURL("image/png"));
      }catch(e){ URL.revokeObjectURL(url); res(url); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("写真を開けなかった（形式が対応外かも）")); };
    img.src=url;
  });
}
async function ocrImage(f){
  if(typeof Tesseract==="undefined"){
    throw new Error("写真を読む機能を読み込めなかった（ネットの制限かも）");
  }
  setStatus("写真を準備中…");
  const src=await normalizeImage(f);
  setStatus("写真の文字を読み取ってるよ…（少し時間がかかるよ）");
  let worker;
  try{
    worker=await Tesseract.createWorker("jpn+eng", 1, {
      workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",
      corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5",
      langPath:"https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0",
      logger:m=>{ if(m && m.status==="recognizing text"){ setStatus("写真を読み取り中… "+Math.round((m.progress||0)*100)+"%"); } }
    });
  }catch(e){
    throw new Error("文字認識エンジンを準備できなかった（"+((e&&e.message)||e)+"）");
  }
  try{
    const { data:{ text } }=await worker.recognize(src);
    return (text||"").replace(/\n{3,}/g,"\n\n").trim();
  } finally {
    try{ await worker.terminate(); }catch(e){}
  }
}
async function extractFileText(f){
  const isImage = /^image\//.test(f.type) ||
    /\.(png|jpe?g|gif|webp|heic|heif|bmp|tiff?|svg)$/i.test(f.name);
  if(isImage){
    return await ocrImage(f);
  }
  if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
    return await extractPdfText(f);
  }
  try{ if(f.text) return await f.text(); }catch(e){}
  return await readAsText(f);
}

const PDF_TIP = "\n\nもしPDFがうまく読めないときは、PDFを開いて文章を選んでコピーし、下の入力欄に貼り付けて送ってね。それなら確実に読めるよ。";
const IMG_TIP = "\n\n【確実な方法（無料）】iPhoneの「ライブテキスト」を使うと、写真の文字をそのままコピーできるよ。\n①「写真」アプリで写真を開く → ②文字を長押し → ③『すべて選択』でコピー → ④下の入力欄に貼り付けて送ってね。\nそれと、写真は文字が大きくはっきり・明るいところで真上から撮ると読みやすいよ。";
fileBtn.addEventListener("click", ()=>{ if(!busy) fileInput.click(); });
fileInput.addEventListener("change", async ()=>{
  const f=fileInput.files && fileInput.files[0];
  fileInput.value="";
  if(!f) return;
  const isPdf = f.type==="application/pdf" || /\.pdf$/i.test(f.name);
  const isImage = /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp|heic|heif|bmp|tiff?|svg)$/i.test(f.name);
  setStatus("…ファイルを読んでるよ");
  try{
    let text=await extractFileText(f);
    if(!text || !text.trim()){
      addBubble("assistant",
        isImage ? "この写真からは文字を読み取れなかった…。"+IMG_TIP :
        isPdf   ? "このPDFからは文字を取り出せなかった…。写真をスキャンしただけのPDF（中身が画像）かもしれないね。"+PDF_TIP :
                  "このファイルからは文字を読み取れなかった…。テキストファイルかPDFを試してみてね。");
      setStatus(""); return;
    }
    let truncated=false;
    if(text.length>FILE_MAX){ text=text.slice(0,FILE_MAX); truncated=true; }
    pendingFile={ name:f.name, kind:"doc", text: text + (truncated ? "\n…（長いので途中までにしたよ）" : "") };
    renderPending();
    refreshSendDisabled();
    setStatus("読めたよ。送るボタンか、ひとこと添えて送ってね");
    setTimeout(()=>{ if(statusEl.textContent.indexOf("読めたよ")===0) setStatus(""); }, 4000);
  }catch(e){
    const reason=(e && e.message) ? e.message : String(e);
    addBubble("assistant","ごめん、ファイルを読めなかった…。\n（"+reason+"）"+(isPdf?PDF_TIP:isImage?IMG_TIP:""));
    setStatus("");
  }
});

/* 天気・近くの名所は、この表示枠（iframe）が外部サイトへの通信を
   ブロックするため安定して動かせず、削除しました。リアルタイム情報を
   出すには、別途バックエンド＋Claude API（Web検索）が必要です。 */

voiceBtn.addEventListener("click",()=>{
  ttsEnabled=!ttsEnabled;
  voiceBtn.classList.toggle("on", ttsEnabled);
  voiceLbl.textContent = ttsEnabled ? "声オン" : "声オフ";
  if(ttsEnabled){
    if(!window.speechSynthesis){
      setStatus("ごめん、この画面では音声が使えないみたい");
      return;
    }
    // このボタンのタップ操作の“中で”直接しゃべる＝iPhoneで音が出やすい。
    // これで声が聞こえたら音声機能はOK。聞こえないときは端末のマナー
    // モード/音量、または表示枠の制限が原因。
    ttsUnlocked=true;
    loadVoices();
    refreshVoicesSoon();
    speak("こんにちは。わたしの声、聞こえてるかな？");
  } else if(window.speechSynthesis){
    speechSynthesis.cancel(); setState("idle");
  }
});

// 声を選ぶメニュー：選ぶと保存して、その声でテスト発声する
const voiceSel=document.getElementById("voiceSel");
if(voiceSel){
  voiceSel.addEventListener("change", ()=>{
    voicePref = voiceSel.value || "auto";
    try{ window.storage.set(K_VOICE, voicePref, false); }catch(e){}
    ttsUnlocked=true;

    if(!ttsEnabled){ ttsEnabled=true; voiceBtn.classList.add("on"); voiceLbl.textContent="声オン"; }
    speak("この声でお話しするね。");

}

resetBtn.addEventListener("click", async ()=>{
  if(!confirm("これまでの会話の記憶を消すよ。いい?")) return;
  await clearMemory();
  history=[]; memorySummary=""; userTurns=0;
  logEl.innerHTML="";
  greet(true);
});

/* ---------- start ---------- */
function greet(reset){
  if(history.length>0 && !reset){
    // 過去の会話を復元表示
    for(const m of history){ addBubble(m.role, m.content); }
    addDivider("ここから続き");
    const back="おかえり! また話せてうれしいな。前回の続きでも、新しい話でも、どっちでもいいよ。";
    history.push({role:"assistant", content:back});
    addBubble("assistant", back);
    speak(back);
  }else{
    const hi="やっほー、来てくれてありがとう。わたしはきみの話し相手だよ。今日はどんな気分? どんなことでも、ゆっくり話してね。";
    history.push({role:"assistant", content:hi});
    addBubble("assistant", hi);
    speak(hi);
  }
}

/* ---------- voice input (speech-to-text) ---------- */
const micBtn=document.getElementById("micBtn");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, listening=false, recogTimer=null;
function stopListening(){ try{ if(recog) recog.stop(); }catch(e){} clearTimeout(recogTimer); }
let voiceHelpShown=false, startWatch=null;
const inFrame = (window.self !== window.top); // アプリは枠(iframe)内で動く
function showVoiceHelp(reason){
  if(!voiceHelpShown){
    voiceHelpShown=true;
    addBubble("assistant",
      "アプリ内のマイクがうまく動かないみたい。"+(reason?("（"+reason+"）"):"")+"\\n"+
      "この表示枠の制限で、アプリからマイクを使えないことがあるんだ。\\n\\n"+
      "確実なのはiPhoneのキーボードの音声入力だよ：\\n"+
      "①入力欄をタップ → ②キーボードの🎤（マイク）を押す → ③話すと文字になる → ④送信ボタンで送る。\\n"+
      "これならそのまま使えるはず。");
  }
}
function startListening(){
  if(!SR){ setStatus("この環境では音声入力が使えないみたい。"); showVoiceHelp("この環境は音声入力に非対応"); return; }
  if(listening){ stopListening(); return; }
  try{
    recog=new SR();
    recog.lang="ja-JP"; recog.continuous=false; recog.interimResults=true; recog.maxAlternatives=1;
    let finalText="";
    recog.onstart=()=>{ listening=true; micBtn.classList.add("on"); setStatus("🎤 聞いてるよ…（話してね）"); clearTimeout(startWatch); };
    recog.onresult=(e)=>{
      let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript;
      }
      inputEl.value=(finalText+interim); autoGrow();
      sendEl.disabled=(inputEl.value.trim()==="")||busy;
    };
    recog.onerror=(e)=>{
      clearTimeout(startWatch); listening=false; micBtn.classList.remove("on");
      const er=(e&&e.error)?e.error:"不明";
      setStatus("音声入力エラー: "+er);
      if(er==="not-allowed"||er==="service-not-allowed") showVoiceHelp("マイクの許可が下りなかった: "+er);
      else if(er==="no-speech") setStatus("声が聞き取れなかったよ。もう一度試してね。");
      else showVoiceHelp("エラー: "+er);
    };
    recog.onend=()=>{
      listening=false; micBtn.classList.remove("on"); clearTimeout(recogTimer); clearTimeout(startWatch);
      if((statusEl.textContent||"").indexOf("聞いてる")>=0) setStatus(inputEl.value.trim()?"声を文字にしたよ。送信ボタンで送ってね。":"");
    };
    setStatus("🎤 マイクを準備中…");
    recog.start();
    recogTimer=setTimeout(()=>{ try{recog.stop();}catch(e){} }, 10000); // iOS対策: 10秒で自動停止
    // 起動監視: 2.5秒たっても開始しなければ「枠の制限で動かない」とみなす
    startWatch=setTimeout(()=>{
      if(!listening){
        try{recog.stop();}catch(e){}
        micBtn.classList.remove("on");
        setStatus("マイクが起動しなかったよ。");
        showVoiceHelp(inFrame?"アプリの表示枠がマイクを許可していない可能性":"マイクが起動しない");
      }
    }, 2500);
  }catch(err){
    listening=false; micBtn.classList.remove("on"); clearTimeout(startWatch);
    setStatus("音声入力を開始できなかった: "+((err&&err.message)||""));
    showVoiceHelp("開始できなかった: "+((err&&err.message)||""));
  }
}
micBtn.addEventListener("click", startListening);

/* ---------- slide creation (PowerPoint) ---------- */
const slideBtn=document.getElementById("slideBtn");
const slideModal=document.getElementById("slideModal");
const slideTopic=document.getElementById("slideTopic");
const slideMake=document.getElementById("slideMake");
const slideCancel=document.getElementById("slideCancel");
const slideNote=document.getElementById("slideNote");

slideBtn.addEventListener("click",()=>{ slideModal.hidden=false; setTimeout(()=>slideTopic.focus(),50); });
slideCancel.addEventListener("click",()=>{ slideModal.hidden=true; });
slideModal.addEventListener("click",(e)=>{ if(e.target===slideModal) slideModal.hidden=true; });

const SLIDE_SYS = `あなたはプレゼン資料の構成作成者です。次の依頼に基づき、PowerPointスライドの構成をJSONだけで出力してください。
出力はJSONのみ。前後に説明文やコードブロック記号(\`\`\`)を絶対に付けないこと。
スキーマ:
{"title":"表紙タイトル","subtitle":"表紙サブタイトル(任意・空文字可)","slides":[{"heading":"スライド見出し","bullets":["箇条書き1","箇条書き2"]}]}
ルール: 日本語。slidesは4〜7枚。1枚あたりbulletsは3〜5個。各bulletは1行で簡潔に(長文禁止)。依頼にない数値や事実を創作しないこと。`;

async function buildPptx(data){
  const pptx=new PptxGenJS();
  pptx.layout="LAYOUT_4x3";
  const F="游ゴシック";
  const cover=pptx.addSlide();
  cover.background={color:"FBF4E7"};
  cover.addText(String(data.title||"スライド"),{x:0.6,y:2.5,w:9,h:1.3,fontFace:F,fontSize:24,bold:true,color:"3A322A",align:"center",valign:"middle"});
  if(data.subtitle) cover.addText(String(data.subtitle),{x:0.6,y:3.9,w:9,h:0.8,fontFace:F,fontSize:16,color:"6B5F51",align:"center"});
  (data.slides||[]).forEach(sl=>{
    const s=pptx.addSlide();
    s.background={color:"FFFFFF"};
    s.addText(String(sl.heading||""),{x:0.6,y:0.5,w:8.8,h:0.9,fontFace:F,fontSize:20,bold:true,color:"A44E2A",valign:"middle"});
    s.addShape(pptx.ShapeType.line,{x:0.6,y:1.45,w:8.8,h:0,line:{color:"C9683D",width:1.5}});
    const items=(sl.bullets||[]).map(b=>({text:String(b),options:{bullet:{code:"2022"},fontFace:F,fontSize:16,color:"3A322A",paraSpaceAfter:12,breakLine:true}}));
    if(items.length) s.addText(items,{x:0.9,y:1.8,w:8.2,h:5.0,valign:"top"});
  });
  return await pptx.write({outputType:"blob"});
}

function addDownloadBubble(filename, url, n){
  const row=document.createElement("div"); row.className="row ai";
  const mini=document.createElement("div"); mini.className="mini"; mini.textContent="話";
  const b=document.createElement("div"); b.className="bubble";
  const t=document.createElement("div"); t.textContent="スライドができたよ！（"+(n||0)+"枚）下のボタンから保存してね。";
  b.appendChild(t);
  const a=document.createElement("a"); a.href=url; a.download=filename; a.className="dl-link"; a.textContent="📥 "+filename; a.target="_blank"; a.rel="noopener";
  b.appendChild(a);
  row.appendChild(mini); row.appendChild(b);
  logEl.appendChild(row); mainEl.scrollTop=mainEl.scrollHeight;
}

async function makeSlides(){
  const topic=slideTopic.value.trim();
  if(!topic){ slideNote.textContent="作りたいスライドの内容を書いてね。"; return; }
  if(typeof PptxGenJS==="undefined"){ slideNote.textContent="スライド作成ライブラリを読み込めなかったみたい。ネット接続を確認して、開き直してね。"; return; }
  slideMake.disabled=true; slideNote.textContent="…内容を考えてるよ";
  try{
    const raw=await callClaude([{role:"user", content:topic}], SLIDE_SYS);
    let txt=(raw||"").replace(/```json/gi,"").replace(/```/g,"").trim();
    const a=txt.indexOf("{"), z=txt.lastIndexOf("}");
    if(a>=0 && z>a) txt=txt.slice(a,z+1);
    const json=JSON.parse(txt);
    slideNote.textContent="…スライドを組み立ててるよ";
    const blob=await buildPptx(json);
    const fname=(String(json.title||"スライド").replace(/[\\/:*?"<>|\s]/g,"_").slice(0,40))+".pptx";
    const url=URL.createObjectURL(blob);
    slideModal.hidden=true; slideMake.disabled=false; slideNote.textContent=""; slideTopic.value="";
    addDownloadBubble(fname, url, (json.slides||[]).length);
    history.push({role:"assistant", content:"「"+(json.title||topic)+"」のスライドを作ったよ。"});
    await saveMemory();
  }catch(err){
    slideMake.disabled=false;
    const m=(err&&err.message)?err.message:"原因不明";
    slideNote.textContent="うまく作れなかった…（"+m+"）";
    console.error("makeSlides failed:", err);
  }
}
slideMake.addEventListener("click", makeSlides);

(async function init(){
  setState("idle");
  await loadHeaderPref();
  await loadVoicePref();
  await loadMemory();
  greet(false);
  await saveMemory();
})();
</script>
